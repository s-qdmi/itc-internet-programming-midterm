<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A comprehensive task management application.">
    <title>Contact - eLibrary</title> <!-- CHANGE THIS PER PAGE -->

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/contact.js" defer></script>
</head>
<body>

    <!-- Header will be injected here by JavaScript -->
    <div id="header-placeholder"></div>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="container my-4">
        <section class="text-center mb-5">
            <h1 class="fw-bold text-primary">Contact eLibrary</h1>
        </section>
        <section class="mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <h3 class="text-center"><i class="bi bi-envelope-fill text-primary me-2"></i>Send Us a Message</h3>
                            <form id="contactForm" novalidate>
                                <div class="mb-3">
                                    <label for="contactName" class="form-label">Your Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="contactName" placeholder="John Doe" required>
                                    <div class="invalid-feedback">Please enter your name.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="contactEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="contactEmail" placeholder="john@example.com" required>
                                    <div class="invalid-feedback">Please enter a valid email address.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="contactSubject" class="form-label">Subject <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="contactSubject" placeholder="How can we help?" required>
                                    <div class="invalid-feedback">Please enter a subject.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="contactMessage" class="form-label">Message <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="contactMessage" rows="5" placeholder="Your message here..." required></textarea>
                                    <div class="invalid-feedback">Please enter your message.</div>
                                </div>
                                <button type="submit" class="btn text-primary btn-lg w-100">
                                    <i class="bi bi-send-fill me-2"></i>Send Message
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="mb-5">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3453.123456789!2d29.9081!3d31.2089!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14f5c3b5e5b5e5b5%3A0x5e5b5e5b5e5b5e5b!2sBibliotheca%20Alexandrina!5e0!3m2!1sen!2seg!4v1234567890" 
                width="100%" 
                height="300" 
                style="border:0; border-radius: 0.375rem;">
            </iframe>
        </section>
    </main>

    <!-- Footer will be injected here by JavaScript -->
    <div id="footer-placeholder"></div>

</body>
</html>
